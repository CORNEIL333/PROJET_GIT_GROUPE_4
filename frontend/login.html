<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — GitUniversitaire</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:linear-gradient(145deg,#fef9f0,#fff7eb);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:white;border-radius:2rem;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,0.1);}
    .logo{text-align:center;font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#c4450c,#f09b42);background-clip:text;-webkit-background-clip:text;color:transparent;margin-bottom:0.3rem;}
    .subtitle{text-align:center;color:#4a5b4e;font-size:0.9rem;margin-bottom:2rem;}
    label{font-size:0.85rem;font-weight:600;color:#4a5b4e;display:block;margin-bottom:5px;}
    input,select{width:100%;padding:0.75rem 1rem;border-radius:12px;border:1.5px solid #e0d5c8;font-family:'Inter',sans-serif;font-size:0.92rem;outline:none;margin-bottom:1rem;}
    input:focus,select:focus{border-color:#e67e22;}
    .btn{width:100%;background:#e67e22;color:white;padding:0.9rem;border-radius:48px;border:none;font-weight:700;font-size:1rem;cursor:pointer;}
    .btn:hover{background:#cf711f;}
    .back{display:block;text-align:center;margin-top:1rem;color:#e67e22;font-size:0.85rem;text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓 GitUniversitaire</div>
    <div class="subtitle">Connecte-toi à ton espace</div>
    <label>Rôle</label>
    <select>
      <option>👨‍🎓 Étudiant</option>
      <option>👨‍🏫 Enseignant</option>
      <option>🛡️ Administrateur</option>
    </select>
    <label>Email universitaire</label>
    <input type="email" placeholder="jean.dupont@univ.cm">
    <label>Mot de passe</label>
    <input type="password" placeholder="••••••••">
    <button class="btn">Se connecter</button>
    <a href="index.html" class="back">← Retour à l'accueil</a>
  </div>
</body>
</html>
